services:
  app:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    environment:
      COMPOSER_HOME: /tmp/composer
      HOME: /tmp
      DB_HOST: mysql
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: matched_giving
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 2s
      timeout: 5s
      retries: 30
